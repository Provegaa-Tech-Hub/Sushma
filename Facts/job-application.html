<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Career Path | Job Application</title>

    <link rel="stylesheet"
          href="css/job-application.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="page-header">

        <h1>

            <i class="fa-solid fa-briefcase"></i>

            Job Application

        </h1>

        <p>

            Complete the application form and submit your application.

        </p>

    </div>

    <!-- Application Form -->

    <form id="applicationForm">

        <div class="form-grid">

            <!-- Full Name -->

            <div class="form-group">

                <label>

                    Full Name <span>*</span>

                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter Full Name"
                    required>

            </div>

            <!-- Email -->

            <div class="form-group">

                <label>

                    Email Address <span>*</span>

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required>

            </div>

            <!-- Phone -->

            <div class="form-group">

                <label>

                    Mobile Number <span>*</span>

                </label>

                <input
                    type="tel"
                    id="phone"
                    maxlength="10"
                    placeholder="Enter Mobile Number"
                    required>

            </div>

            <!-- Qualification -->

            <div class="form-group">

                <label>

                    Qualification <span>*</span>

                </label>

                <input
                    type="text"
                    id="qualification"
                    placeholder="Qualification"
                    required>

            </div>

            <!-- Current City -->

            <div class="form-group">

                <label>

                    Current City

                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="Current City">

            </div>

            <!-- Expected Salary -->

            <div class="form-group">

                <label>

                    Expected Salary

                </label>

                <input
                    type="text"
                    id="salary"
                    placeholder="Expected Salary">

            </div>

        </div>

        <!-- Skills -->

        <div class="form-group">

            <label>

                Skills

            </label>

            <input
                type="text"
                id="skills"
                placeholder="Example: HTML, CSS, JavaScript, SQL">

        </div>

        <!-- Resume Upload -->

        <div class="upload-section">

            <label>

                Resume (PDF / DOC / DOCX)

            </label>

            <input
                type="file"
                id="resume"
                accept=".pdf,.doc,.docx">

            <small id="resumeName">

                No Resume Selected

            </small>

        </div>

        <!-- Photo Upload -->

        <div class="upload-section">

            <label>

                Passport Size Photo

            </label>

            <input
                type="file"
                id="photo"
                accept=".jpg,.jpeg,.png">

            <div class="preview">

                <img
                    id="photoPreview"
                    src="images/profile.png"
                    alt="Photo Preview">

            </div>

        </div>

        <!-- Cover Letter -->

        <div class="form-group">

            <label>

                Cover Letter

            </label>

            <textarea
                id="coverLetter"
                rows="8"
                maxlength="1000"
                placeholder="Write your cover letter here..."></textarea>

            <div class="counter">

                <span id="wordCounter">

                    0 / 1000 Characters

                </span>

            </div>

        </div>

        <!-- Declaration -->

        <div class="checkbox">

            <input
                type="checkbox"
                id="agree"
                required>

            <label for="agree">

                I confirm that all the information provided is correct.

            </label>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button
                type="button"
                id="saveBtn">

                <i class="fa-solid fa-floppy-disk"></i>

                Save Draft

            </button>

            <button
                type="reset">

                <i class="fa-solid fa-rotate-left"></i>

                Reset

            </button>

            <button
                type="submit">

                <i class="fa-solid fa-paper-plane"></i>

                Submit Application

            </button>

        </div>

    </form>

</div>

<script src="js/job-application.js"></script>

</body>

</html>
