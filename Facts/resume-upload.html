<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume Upload</title>

<link rel="stylesheet" href="css/resume-upload.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="upload-box">

<h1>

<i class="fa-solid fa-file-arrow-up"></i>

Resume Upload

</h1>

<p class="subtitle">

Upload your latest resume

(PDF, DOC, DOCX | Maximum 5 MB)

</p>

<form id="resumeForm">

<div class="upload-area">

<i class="fa-solid fa-cloud-arrow-up upload-icon"></i>

<input
type="file"
id="resumeFile"
accept=".pdf,.doc,.docx">

<label for="resumeFile" class="upload-btn">

Choose Resume

</label>

</div>

<div class="preview">

<h3>Resume Preview</h3>

<div id="filePreview">

No file selected

</div>

</div>

<div class="buttons">

<button
type="button"
id="saveBtn">

Save

</button>

<button
type="submit">

Next

</button>

</div>

</form>

</div>

</div>

<script src="js/resume-upload.js"></script>

</body>

</html>
