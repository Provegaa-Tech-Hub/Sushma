<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mock Test</title>

<link rel="stylesheet" href="css/mock-test.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<h1>

<i class="fa-solid fa-book-open"></i>

Mock Test

</h1>

<div class="candidate">

<p><b>Education :</b> <span id="education"></span></p>

<p><b>Experience :</b> <span id="experience"></span></p>

<p><b>Preferred Role :</b> <span id="role"></span></p>

</div>

<div class="question-box">

<h2 id="questionNo">
Question 1
</h2>

<h3 id="question"></h3>

<div id="options"></div>

</div>

<div class="buttons">

<button id="prevBtn">

Previous

</button>

<button id="nextBtn">

Next

</button>

<button id="submitBtn">

Submit

</button>

</div>

</div>

<script src="js/mock-test.js"></script>

</body>
</html>
