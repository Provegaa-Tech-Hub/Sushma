<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Path | Fresher Mock Test</title>

    <link rel="stylesheet" href="css/fresher-mock-test.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="header">

        <div>

            <h1>
                <i class="fa-solid fa-graduation-cap"></i>
                Fresher Mock Test
            </h1>

            <p>
                Basic Assessment for Freshers
            </p>

        </div>

        <div class="timer-box">

            <span>
                <i class="fa-solid fa-clock"></i>
                Time Left
            </span>

            <h2 id="timer">
                60:00
            </h2>

        </div>

    </header>

    <!-- Candidate Details -->

    <section class="candidate-card">

        <div class="candidate-item">

            <label>Candidate</label>

            <span id="candidateName">
                Manga
            </span>

        </div>

        <div class="candidate-item">

            <label>Education</label>

            <span id="education">
                B.Tech
            </span>

        </div>

        <div class="candidate-item">

            <label>Experience</label>

            <span id="experience">
                Fresher
            </span>

        </div>

        <div class="candidate-item">

            <label>Preferred Role</label>

            <span id="jobRole">
                Software Tester
            </span>

        </div>

    </section>

    <!-- Statistics -->

    <section class="stats">

        <div class="stat-card">

            <h3 id="totalQuestions">70</h3>

            <p>Total Questions</p>

        </div>

        <div class="stat-card">

            <h3 id="answeredCount">0</h3>

            <p>Answered</p>

        </div>

        <div class="stat-card">

            <h3 id="remainingCount">70</h3>

            <p>Remaining</p>

        </div>

        <div class="stat-card">

            <h3>60 Min</h3>

            <p>Duration</p>

        </div>

    </section>

    <!-- Progress -->

    <section class="progress-section">

        <div class="progress-top">

            <span>
                Progress
            </span>

            <span id="progressText">

                Question 1 of 70

            </span>

        </div>

        <div class="progress-bar">

            <div id="progressFill"></div>

        </div>

    </section>

    <!-- Question Area -->

    <section class="question-card">

        <div class="question-header">

            <h2 id="questionNumber">

                Question 1

            </h2>

            <span id="questionCategory">

                HTML

            </span>

        </div>

        <h3 id="questionText">

            Loading Question...

        </h3>

        <div id="optionsContainer">

            <!-- JavaScript Loads Options -->

        </div>

    </section>

    <!-- Navigation -->

    <section class="navigation">

        <button id="previousBtn">

            <i class="fa-solid fa-arrow-left"></i>

            Previous

        </button>

        <button id="reviewBtn">

            <i class="fa-solid fa-flag"></i>

            Mark for Review

        </button>

        <button id="nextBtn">

            Next

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </section>

    <!-- Question Palette -->

    <section class="palette">

        <h2>

            Question Palette

        </h2>

        <div id="questionPalette">

            <!-- Generated by JS -->

        </div>

    </section>

    <!-- Footer Buttons -->

    <section class="footer-buttons">

        <button class="save-btn" id="saveBtn">

            <i class="fa-solid fa-floppy-disk"></i>

            Save Answers

        </button>

        <button class="submit-btn" id="submitBtn">

            <i class="fa-solid fa-paper-plane"></i>

            Submit Test

        </button>

    </section>

</div>

<script src="js/questions.js"></script>

<script src="js/fresher-mock-test.js"></script>

</body>
</html>
