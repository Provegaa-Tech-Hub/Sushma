<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Career Objective</title>

<link rel="stylesheet" href="css/career-objective.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="objective-box">

<h1>
<i class="fa-solid fa-bullseye"></i>
Career Objective
</h1>

<p class="subtitle">
Write a short career objective that highlights your goals,
skills, and career aspirations.
</p>

<form id="objectiveForm">

<label>Career Objective</label>

<textarea
id="objective"
rows="10"
maxlength="2000"
placeholder="Example:
I am looking for an opportunity to improve my skills and contribute to organizational growth.">
</textarea>

<div class="counter">

<span id="wordCount">Words : 0 / 300</span>

</div>

<div class="buttons">

<button
type="button"
id="saveBtn">

Save

</button>

<button
type="submit">

Next

</button>

</div>

</form>

</div>

</div>

<script src="js/career-objective.js"></script>

</body>
</html>
