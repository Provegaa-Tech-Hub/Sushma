<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Career Path | Score Card</title>

<link rel="stylesheet" href="css/score-card.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="score-card">

<h1>

<i class="fa-solid fa-award"></i>

Assessment Score Card

</h1>

<p class="candidate">

Candidate :
<b id="candidateName">Manga</b>

</p>

<div class="summary">

<div class="card">
<h2 id="totalQuestions">50</h2>
<p>Total Questions</p>
</div>

<div class="card">
<h2 id="correctAnswers">40</h2>
<p>Correct</p>
</div>

<div class="card">
<h2 id="wrongAnswers">10</h2>
<p>Wrong</p>
</div>

<div class="card">
<h2 id="scorePercent">80%</h2>
<p>Score</p>
</div>

<div class="card">
<h2 id="grade">A</h2>
<p>Grade</p>
</div>

</div>

<div class="progress-section">

<div class="progress-circle">

<div class="inner-circle">

<span id="circleScore">

80%

</span>

</div>

</div>

<h3>Overall Performance</h3>

<p id="performanceText">

Excellent Performance

</p>

</div>

<div class="buttons">

<button id="downloadPDF">

<i class="fa-solid fa-file-pdf"></i>

Download PDF

</button>

<button id="downloadCertificate">

<i class="fa-solid fa-certificate"></i>

Download Certificate

</button>

</div>

</div>

</div>

<script src="js/score-card.js"></script>

</body>

</html>
