<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Education Details</title>

<link rel="stylesheet" href="css/education.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="form-box">

        <h1>
            <i class="fa-solid fa-user-graduate"></i>
            Education Details
        </h1>

        <form id="educationForm">

            <div class="row">

                <div class="input-group">
                    <label>Qualification</label>
                    <select id="qualification" required>
                        <option value="">Select Qualification</option>
                        <option>SSC</option>
                        <option>Intermediate</option>
                        <option>Diploma</option>
                        <option>B.Tech</option>
                        <option>B.Sc</option>
                        <option>B.Com</option>
                        <option>M.Tech</option>
                        <option>MBA</option>
                        <option>MCA</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Degree</label>
                    <input type="text" id="degree" placeholder="Enter Degree" required>
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Branch / Specialization</label>
                    <input type="text" id="branch" placeholder="Computer Science">
                </div>

                <div class="input-group">
                    <label>College Name</label>
                    <input type="text" id="college">
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>University</label>
                    <input type="text" id="university">
                </div>

                <div class="input-group">
                    <label>Passing Year</label>
                    <input type="number" id="year" min="1990" max="2035">
                </div>

            </div>

            <div class="row">

                <div class="input-group">
                    <label>Percentage / CGPA</label>
                    <input type="text" id="percentage">
                </div>

                <div class="input-group">
                    <label>Backlogs</label>
                    <select id="backlogs">
                        <option>No Backlogs</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3+</option>
                    </select>
                </div>

            </div>

            <div class="input-group">

                <label>Skills</label>

                <textarea
                id="skills"
                rows="5"
                placeholder="HTML, CSS, JavaScript, Manual Testing..."></textarea>

            </div>

            <div class="buttons">

                <button type="button" id="saveBtn">
                    Save
                </button>

                <button type="submit">
                    Next
                </button>

            </div>

        </form>

    </div>

</div>

<script src="js/education.js"></script>

</body>
</html>
