<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Career Path - Login</title>

    <link rel="stylesheet" href="css/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="left-panel">

        <h1>CAREER PATH</h1>

        <p>
            Build Your Career.<br>
            Discover Jobs.<br>
            Crack Mock Tests.<br>
            Achieve Success.
        </p>

    </div>

    <div class="right-panel">

        <div class="login-box">

            <h2>Login</h2>

            <form id="loginForm">

                <div class="input-box">

                    <i class="fa fa-envelope"></i>

                    <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

                </div>

                <div class="input-box">

                    <i class="fa fa-lock"></i>

                    <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                    <i
                    class="fa fa-eye togglePassword"
                    id="togglePassword"></i>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit">

                    Login

                </button>

            </form>

            <div class="register">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </div>

        </div>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
