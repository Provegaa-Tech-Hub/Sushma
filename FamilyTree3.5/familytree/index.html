<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>familytree</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div id="root"></div>
    <!-- SVG Definitions for Smooth Custom Shapes -->
    <svg width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden;">
        <defs>
            <clipPath id="shape-apple-clip" clipPathUnits="objectBoundingBox">
                <path
                    d="M 0.5 0.12 C 0.7 0.02, 1.0 0.1, 0.98 0.45 C 0.95 0.8, 0.7 1.0, 0.5 0.92 C 0.3 1.0, 0.05 0.8, 0.02 0.45 C 0.0 0.1, 0.3 0.02, 0.5 0.12 Z">
                </path>
            </clipPath>
            <clipPath id="shape-sunflower-clip" clipPathUnits="objectBoundingBox">
                <path
                    d="M 0.41 0.16 Q 0.5 0.0, 0.59 0.16 Q 0.75 0.07, 0.75 0.25 Q 0.93 0.25, 0.84 0.41 Q 1.0 0.5, 0.84 0.59 Q 0.93 0.75, 0.75 0.75 Q 0.75 0.93, 0.59 0.84 Q 0.5 1.0, 0.41 0.84 Q 0.25 0.93, 0.25 0.75 Q 0.07 0.75, 0.16 0.59 Q 0.0 0.5, 0.16 0.41 Q 0.07 0.25, 0.25 0.25 Q 0.25 0.07, 0.41 0.16 Z">
                </path>
            </clipPath>
            <clipPath id="shape-rose-clip" clipPathUnits="objectBoundingBox">
                <path
                    d="M 0.1 0.15 C 0.2 0.25, 0.3 0.25, 0.4 0.08 C 0.45 0.18, 0.55 0.18, 0.6 0.08 C 0.7 0.25, 0.8 0.25, 0.9 0.15 C 1.0 0.45, 0.9 0.8, 0.5 1.0 C 0.1 0.8, 0.0 0.45, 0.1 0.15 Z">
                </path>
            </clipPath>
        </defs>
    </svg>
    <!-- Top Toolbar -->
    <div class="top-toolbar">
        <div class="toolbar-left">
            <span class="toolbar-title" data-i18n="familyTreeTemplate">Family Tree</span>
        </div>
        <div class="toolbar-center" style="display: none;">
            <button class="toolbar-btn" title="Add Text" onclick="showTextTool()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="9" x2="20" y2="9"></line>
                    <line x1="4" y1="15" x2="20" y2="15"></line>
                    <line x1="12" y1="3" x2="12" y2="21"></line>
                </svg>
            </button>
            <button class="toolbar-btn" title="Draw Connector" onclick="showConnectorTool()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 12 L10 6 L20 16"></path>
                </svg>
            </button>
            <button class="toolbar-btn" title="Add Link" onclick="showLinkTool()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
            </button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn" title="Align Objects" onclick="showAlignTool()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
            </button>
            <button class="toolbar-btn" title="Comments" onclick="showComments()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </button>
            <button class="toolbar-btn" title="Emoji" onclick="showEmojiPicker()">😊</button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn" title="More Options">⋯</button>
        </div>
        <div class="toolbar-right">
            <!-- Photo Toggle -->
            <div style="display: flex; align-items: center; gap: 8px; margin-right: 15px;">
                <span style="font-size: 14px; color: #666;">Add Photo</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="globalPhotoToggle" checked onchange="toggleGlobalPhotos()">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <!-- Google Translate Dropdown -->
            <div id="google_translate_element"></div>
            <button onclick="resetTranslate()">English</button>
            <button class="btn-export-toolbar" onclick="showExportMenu(event)">Export</button>
            <div id="exportMenu" class="export-dropdown" style="display: none;">
                <button onclick="exportAsImage(); hideExportMenu()">Download as PNG</button>
                <button onclick="exportAsPDF(); hideExportMenu()">Download as PDF</button>
                <button onclick="printTree(); hideExportMenu()">Print / Save as PDF</button>
            </div>
            <button class="btn-share-toolbar" onclick="showShareMenu(event)">Share</button>
            <div id="shareMenu" class="export-dropdown" style="display: none;">
                <button onclick="shareToWhatsApp(); hideShareMenu()">
                    <span style="font-size: 18px;">📱</span> WhatsApp
                </button>
                <button onclick="shareToFacebook(); hideShareMenu()">
                    <span style="font-size: 18px;">👥</span> Facebook
                </button>
                <button onclick="shareToInstagram(); hideShareMenu()">
                    <span style="font-size: 18px;">📸</span> Instagram
                </button>
                <button onclick="shareToTwitter(); hideShareMenu()">
                    <span style="font-size: 18px;">🐦</span> Twitter
                </button>
                <button onclick="copyShareLink(); hideShareMenu()">
                    <span style="font-size: 18px;">🔗</span> Copy Link
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="tree-container" id="treeContainer">
        <div id="familyTree" class="tree">
            <ul>
                <li data-id="1" data-level="1" data-gender="male">
                    <div class="person level-1 gender-male shape-apple">
                        <button class="card-menu-btn" onclick="toggleCardMenu(event, 1)">⋮</button>
                        <div class="card-menu" id="cardMenu1">
                            <button class="menu-item" onclick="editPersonInfo(1); closeCardMenu()">
                                <span class="menu-icon">✏️</span>
                                <span>Edit Info</span>
                            </button>
                            <button class="menu-item" onclick="addSpouse(1); closeCardMenu()">
                                <span class="menu-icon">💑</span>
                                <span>Add Spouse</span>
                            </button>
                            <button class="menu-item" onclick="addChild(1); closeCardMenu()" style="display: none;">
                                <span class="menu-icon">👶</span>
                                <span>Add Child</span>
                            </button>
                            <button class="menu-item menu-item-danger" onclick="removePerson(1); closeCardMenu()">
                                <span class="menu-icon">🗑️</span>
                                <span>Remove</span>
                            </button>
                        </div>
                        <div class="photo-container"></div>
                        <div class="name">John Smith Sr.</div>
                        <div class="gender-badge">♂</div>
                        <div class="dates">1850-1920</div>
                        <div class="occupation">Farmer</div>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <!-- Add Person Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add New Family Member</h2>
            <form id="addPersonForm">
                <div class="form-group">
                    <label for="personName">Name:</label>
                    <input type="text" id="personName" required>
                </div>
                <div class="form-group">
                    <label for="personGender">Gender:</label>
                    <select id="personGender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="personDates">Dates (optional, e.g., 1990-Present):</label>
                    <input type="text" id="personDates" placeholder="e.g., 1990-Present">
                </div>
                <div class="form-group">
                    <label for="personOccupation">Occupation (optional):</label>
                    <input type="text" id="personOccupation" placeholder="e.g., Engineer, Teacher">
                </div>
                <div class="form-group" id="marriageDateSection" style="display: none;">
                    <label for="marriageDate">Marriage Date:</label>
                    <input type="text" id="marriageDate" placeholder="e.g., 1990 or June 15, 1990">
                </div>
                <div class="form-group" id="modalPhotoSection">
                    <label for="personPhoto">Photo (optional):</label>
                    <input type="file" id="personPhoto" accept="image/*">
                    <div id="photoPreview" class="photo-preview"></div>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn-submit" id="submitBtn">Add Person</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Floating Font Toolbar -->
    <div id="floatingFontMenu" class="floating-font-toolbar" onclick="event.stopPropagation()">
        <select id="floatFontFamily" class="toolbar-select" onchange="applyFloatFont()" onclick="event.stopPropagation()">
            <option value="Arial">Arial</option>
            <option value="Georgia">Georgia</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Verdana">Verdana</option>
            <option value="Trebuchet MS">Trebuchet MS</option>
            <option value="Comic Sans MS">Comic Sans MS</option>
            <option value="Impact">Impact</option>
            <option value="Palatino">Palatino</option>
            <option value="Garamond">Garamond</option>
        </select>

        <select id="floatFontSize" class="toolbar-select-small" onchange="applyFloatFont()" onclick="event.stopPropagation()">
            <option value="12">12</option>
            <option value="14">14</option>
            <option value="16" selected>16</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="22">22</option>
            <option value="24">24</option>
            <option value="26">26</option>
            <option value="28">28</option>
        </select>

        <div class="toolbar-separator"></div>

        <button class="toolbar-btn" id="btnBold" onclick="toggleBold(event)" title="Bold">
            <strong>B</strong>
        </button>

        <button class="toolbar-btn" id="btnItalic" onclick="toggleItalic(event)" title="Italic">
            <em>I</em>
        </button>

        <button class="toolbar-btn" id="btnUnderline" onclick="toggleUnderline(event)" title="Underline">
            <u>U</u>
        </button>

        <div class="toolbar-separator"></div>

        <div class="toolbar-color-dropdown">
            <button class="toolbar-color-btn" id="colorBtn" onclick="toggleColorPicker(event)" title="Text Color">
                <span class="color-icon" id="colorIcon">A</span>
                <div class="color-bar" id="colorBar"></div>
            </button>
            <div class="color-picker-dropdown" id="colorPickerDropdown">
                <div class="color-section">
                    <div class="color-section-title">Theme Colors</div>
                    <div class="color-grid">
                        <div class="color-swatch" style="background: #FFFFFF;" onclick="selectColor('#FFFFFF', event)"></div>
                        <div class="color-swatch" style="background: #000000;" onclick="selectColor('#000000', event)"></div>
                        <div class="color-swatch" style="background: #E7E6E6;" onclick="selectColor('#E7E6E6', event)"></div>
                        <div class="color-swatch" style="background: #44546A;" onclick="selectColor('#44546A', event)"></div>
                        <div class="color-swatch" style="background: #4472C4;" onclick="selectColor('#4472C4', event)"></div>
                        <div class="color-swatch" style="background: #ED7D31;" onclick="selectColor('#ED7D31', event)"></div>
                        <div class="color-swatch" style="background: #A5A5A5;" onclick="selectColor('#A5A5A5', event)"></div>
                        <div class="color-swatch" style="background: #FFC000;" onclick="selectColor('#FFC000', event)"></div>
                        <div class="color-swatch" style="background: #5B9BD5;" onclick="selectColor('#5B9BD5', event)"></div>
                        <div class="color-swatch" style="background: #70AD47;" onclick="selectColor('#70AD47', event)"></div>
                    </div>
                </div>
                <div class="color-section">
                    <div class="color-section-title">Standard Colors</div>
                    <div class="color-grid">
                        <div class="color-swatch" style="background: #C00000;" onclick="selectColor('#C00000', event)"></div>
                        <div class="color-swatch" style="background: #FF0000;" onclick="selectColor('#FF0000', event)"></div>
                        <div class="color-swatch" style="background: #FFC000;" onclick="selectColor('#FFC000', event)"></div>
                        <div class="color-swatch" style="background: #FFFF00;" onclick="selectColor('#FFFF00', event)"></div>
                        <div class="color-swatch" style="background: #92D050;" onclick="selectColor('#92D050', event)"></div>
                        <div class="color-swatch" style="background: #00B050;" onclick="selectColor('#00B050', event)"></div>
                        <div class="color-swatch" style="background: #00B0F0;" onclick="selectColor('#00B0F0', event)"></div>
                        <div class="color-swatch" style="background: #0070C0;" onclick="selectColor('#0070C0', event)"></div>
                        <div class="color-swatch" style="background: #002060;" onclick="selectColor('#002060', event)"></div>
                        <div class="color-swatch" style="background: #7030A0;" onclick="selectColor('#7030A0', event)"></div>
                    </div>
                </div>
                <div class="color-picker-footer">
                    <button class="color-picker-more" onclick="openNativeColorPicker(event)">
                        <span>🎨</span> More Colors...
                    </button>
                </div>
            </div>
            <input type="color" id="floatTextColor" style="display: none;" onchange="applyColorFromNative(event)">
        </div>

        <div class="toolbar-separator"></div>

        <button class="toolbar-btn" id="btnShadow" onclick="toggleTextShadow(event)" title="Text Shadow">
            <span style="text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">S</span>
        </button>

        <div class="toolbar-separator"></div>

        <button class="toolbar-btn-close" onclick="closeFontMenu(event)" title="Close">
            ×
        </button>
    </div>

    <!-- Right Properties Panel -->
    <div id="propertiesPanel" class="properties-panel">
        <div class="panel-header">
            <span class="panel-title">Properties</span>
            <span class="panel-close" onclick="closePropertiesPanel()">&times;</span>
        </div>

        <div id="panelContent" class="panel-content">
            <div class="no-selection">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                </svg>
                <p>Click on any object to edit its properties</p>
            </div>
        </div>
    </div>
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,hi',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script>
        function resetTranslate() {
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + location.hostname + "; path=/;";
            location.reload();
        }
    </script>

    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
