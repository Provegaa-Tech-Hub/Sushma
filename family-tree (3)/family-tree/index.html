<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree - Interactive</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Toolbar -->
    <div class="top-toolbar">
        <div class="toolbar-left">
            <span class="toolbar-title" data-i18n="familyTreeTemplate">Family Tree</span>
        </div>
        <div class="toolbar-center">
            <button class="toolbar-btn" title="Add Text" onclick="showTextTool()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="9" x2="20" y2="9"></line>
                    <line x1="4" y1="15" x2="20" y2="15"></line>
                    <line x1="12" y1="3" x2="12" y2="21"></line>
                </svg>
            </button>
            <button class="toolbar-btn" title="Draw Connector" onclick="showConnectorTool()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 12 L10 6 L20 16"></path>
                </svg>
            </button>
            <button class="toolbar-btn" title="Add Link" onclick="showLinkTool()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
            </button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn" title="Align Objects" onclick="showAlignTool()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
            </button>
            <button class="toolbar-btn" title="Comments" onclick="showComments()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </button>
            <button class="toolbar-btn" title="Emoji" onclick="showEmojiPicker()">😊</button>
            <div class="toolbar-separator"></div>
            <button class="toolbar-btn" title="More Options">⋯</button>
        </div>
        <div class="toolbar-right">
            <select class="language-selector" id="languageSelector" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="hi">हिन्दी (Hindi)</option>
            </select>
            <button class="btn-export-toolbar" onclick="exportAsImage()">Export</button>
            <button class="btn-share-toolbar">Share</button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="tree-container" id="treeContainer">
        <div id="familyTree" class="tree">
            <ul>
                <li data-id="1" data-level="1" data-gender="male">
                    <div class="person level-1 gender-male">
                        <button class="card-menu-btn" onclick="toggleCardMenu(event, 1)">⋮</button>
                        <div class="card-menu" id="cardMenu1">
                            <button class="menu-item" onclick="editPersonInfo(1); closeCardMenu()">
                                <span class="menu-icon">✏️</span>
                                <span>Edit Info</span>
                            </button>
                            <button class="menu-item" onclick="addSpouse(1); closeCardMenu()">
                                <span class="menu-icon">💑</span>
                                <span>Add Spouse</span>
                            </button>
                            <button class="menu-item" onclick="addChild(1); closeCardMenu()">
                                <span class="menu-icon">👶</span>
                                <span>Add Child</span>
                            </button>
                            <button class="menu-item menu-item-danger" onclick="removePerson(1); closeCardMenu()">
                                <span class="menu-icon">🗑️</span>
                                <span>Remove</span>
                            </button>
                        </div>
                        <div class="photo-container"></div>
                        <div class="name">John Smith Sr.</div>
                        <div class="gender-badge">♂</div>
                        <div class="dates">1850-1920</div>
                        <div class="occupation">Farmer</div>
                    </div>
                    <ul>
                        <li data-id="2" data-level="2" data-gender="male">
                            <div class="person level-2 gender-male">
                                <button class="card-menu-btn" onclick="toggleCardMenu(event, 2)">⋮</button>
                                <div class="card-menu" id="cardMenu2">
                                    <button class="menu-item" onclick="editPersonInfo(2); closeCardMenu()">
                                        <span class="menu-icon">✏️</span>
                                        <span>Edit Info</span>
                                    </button>
                                    <button class="menu-item" onclick="addSpouse(2); closeCardMenu()">
                                        <span class="menu-icon">💑</span>
                                        <span>Add Spouse</span>
                                    </button>
                                    <button class="menu-item" onclick="addChild(2); closeCardMenu()">
                                        <span class="menu-icon">👶</span>
                                        <span>Add Child</span>
                                    </button>
                                    <button class="menu-item menu-item-danger" onclick="removePerson(2); closeCardMenu()">
                                        <span class="menu-icon">🗑️</span>
                                        <span>Remove</span>
                                    </button>
                                </div>
                                <div class="photo-container"></div>
                                <div class="name">Robert Smith</div>
                                <div class="gender-badge">♂</div>
                                <div class="dates">1875-1945</div>
                                <div class="occupation">Merchant</div>
                            </div>
                        </li>
                        <li data-id="3" data-level="2" data-gender="female">
                            <div class="person level-2 gender-female">
                                <button class="card-menu-btn" onclick="toggleCardMenu(event, 3)">⋮</button>
                                <div class="card-menu" id="cardMenu3">
                                    <button class="menu-item" onclick="editPersonInfo(3); closeCardMenu()">
                                        <span class="menu-icon">✏️</span>
                                        <span>Edit Info</span>
                                    </button>
                                    <button class="menu-item" onclick="addSpouse(3); closeCardMenu()">
                                        <span class="menu-icon">💑</span>
                                        <span>Add Spouse</span>
                                    </button>
                                    <button class="menu-item" onclick="addChild(3); closeCardMenu()">
                                        <span class="menu-icon">👶</span>
                                        <span>Add Child</span>
                                    </button>
                                    <button class="menu-item menu-item-danger" onclick="removePerson(3); closeCardMenu()">
                                        <span class="menu-icon">🗑️</span>
                                        <span>Remove</span>
                                    </button>
                                </div>
                                <div class="photo-container"></div>
                                <div class="name">Elizabeth Smith</div>
                                <div class="gender-badge">♀</div>
                                <div class="dates">1877-1950</div>
                                <div class="occupation">Nurse</div>
                            </div>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>

    <!-- Add Person Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add New Family Member</h2>
            <form id="addPersonForm">
                <div class="form-group">
                    <label for="personName">Name:</label>
                    <input type="text" id="personName" required>
                </div>
                <div class="form-group">
                    <label for="personGender">Gender:</label>
                    <select id="personGender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="personDates">Dates (optional, e.g., 1990-Present):</label>
                    <input type="text" id="personDates" placeholder="e.g., 1990-Present">
                </div>
                <div class="form-group">
                    <label for="personOccupation">Occupation (optional):</label>
                    <input type="text" id="personOccupation" placeholder="e.g., Engineer, Teacher">
                </div>
                <div class="form-group">
                    <label for="personPhoto">Photo (optional):</label>
                    <input type="file" id="personPhoto" accept="image/*">
                    <div id="photoPreview" class="photo-preview"></div>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn-submit" id="submitBtn">Add Person</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Right Properties Panel -->
    <div id="propertiesPanel" class="properties-panel">
        <div class="panel-header">
            <span class="panel-title">Properties</span>
            <span class="panel-close" onclick="closePropertiesPanel()">&times;</span>
        </div>

        <div id="panelContent" class="panel-content">
            <div class="no-selection">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                </svg>
                <p>Click on any object to edit its properties</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
